# Birthplaces for the place-search hit-rate test, written the way people type them.
# Add more whenever a lookup misses. A hit means the expected place is among the first three results.
- query: "Mumbai, India"
  expect: {country: IN, name: Mumbai}
- query: "Kiev, Ukraine"
  expect: {country: UA, name: Kyiv}
- query: "Maplewood, MN, USA"
  expect: {country: US, name: Maplewood, admin1: MN}
