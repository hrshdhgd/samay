[project]
name = "samay"
version = "0.1.0"
description = "Self-contained Jyotish chart bot with a cited classical rule engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "skyfield>=1.49",
    "python-telegram-bot>=22.8,<23",
    "pyyaml>=6",
    "tzdata",
    "httpx",
    "click>=8.1",
    "rapidfuzz>=3.14.6",
    "indic-transliteration>=2.3.82",
]

[project.scripts]
samay = "samay.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["samay"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
