# Brihat Jataka chapter XX ("On the Planets in the Bhavas") and the strength rules it depends on.
# Source: N. Chidambaram Iyer (tr.), The Brihat Jataka of Varaha Mihira, Madras 1885, public domain
# (archive.org b2488442x). Effect texts are QUOTED from that translation, with obvious scan errors
# corrected; every correction is listed in research/notes/brihat-jataka-ch20.md.
# Checked by h2 on 2026-11-10; no rows were hidden. Set `hidden: true` on a row to remove it from the bot.

verification: {level: translation-checked, checked_by: h2, checked_on: 2026-11-10,
               against: "tr. N. Chidambaram Iyer, Madras 1885 (public domain), ch. XX pp. 181-186"}

edition: "tr. N. Chidambaram Iyer, Madras 1885"

strength:
  # I.13: exaltation signs of the Sun, Moon, Mars, Mercury, Jupiter, Venus, Saturn; depression is the 7th sign.
  exaltation: {sun: aries, moon: taurus, mars: capricorn, mercury: virgo, jupiter: cancer, venus: pisces, saturn: libra}
  # I.14: Moolatrikona signs (the text gives signs only, no degree ranges).
  moolatrikona: {sun: leo, moon: taurus, mars: aries, mercury: virgo, jupiter: sagittarius, venus: libra, saturn: aquarius}
  # II.16-17 (Satyacharya's scheme, as stated by Varahamihira). Anyone not listed is the third kind.
  friends:  {sun: [moon, mars, jupiter], moon: [sun, mercury], mars: [sun, moon, jupiter], mercury: [sun, venus],
             jupiter: [sun, moon, mars], venus: [mercury, saturn], saturn: [venus, mercury]}
  neutrals: {sun: [mercury], moon: [mars, jupiter, venus, saturn], mars: [venus, saturn],
             mercury: [mars, jupiter, saturn], jupiter: [saturn], venus: [mars, jupiter], saturn: [jupiter]}
  # Translator's note (f) to chapter VII: degrees from the Sun within which a planet is Astangata (obscured).
  # Jupiter: the OCR text reads "31" but the page image (p. 62, archive.org leaf 104) prints 11. The other
  # values in this table were read off the same image and agree with the OCR.
  astangata_degrees: {moon: 12, mars: 17, mercury: 14, jupiter: 11, venus: 10, saturn: 15}
  astangata_degrees_retrograde: {mercury: 12, venus: 8}
  # XX.11: share of the GOOD effects that come to pass. Neutral signs are not mentioned in stanza 11.
  good_share: {exaltation: "fully", moolatrikona: "three-quarters", own: "one half", friendly: "one quarter",
               inimical: "less than one quarter", depression: "not at all", astangata: "not at all"}
  # Translator's note to XX.11: share of the BAD effects that come to pass.
  bad_share: {depression: "fully", astangata: "fully", inimical: "three-quarters", friendly: "one half",
              own: "one quarter", moolatrikona: "less than one quarter", exaltation: "not at all"}

# XX.1-9. `when_lagna`: applies only when the lagna is one of these signs (more specific rows win).
# `same_as`: the text gives this planet the same effects as another planet in that house.
# `kind`: good, bad or mixed, as judged when writing this file (part of what the checker confirms).
effects:
  - {planet: sun, house: 1, verse: 1, kind: bad, text: "the person will be fond of fight, slow at work, without sight and without mercy"}
  - {planet: sun, house: 1, verse: 1, when_lagna: [aries], kind: mixed, text: "the person will be rich and afflicted with diseases of the eye"}
  - {planet: sun, house: 1, verse: 1, when_lagna: [leo], kind: bad, text: "he will be blind at night"}
  - {planet: sun, house: 1, verse: 1, when_lagna: [libra], kind: bad, text: "the person will be blind and poor"}
  - {planet: sun, house: 1, verse: 1, when_lagna: [cancer], kind: bad, text: "he will have a mote in his eye"}
  - {planet: sun, house: 2, verse: 1, kind: mixed, text: "the person will be greatly rich, will have his wealth carried away by the king and will suffer from diseases in the face"}
  - {planet: sun, house: 3, verse: 2, kind: good, text: "the person will be intelligent and powerful"}
  - {planet: sun, house: 4, verse: 2, kind: bad, text: "the person will be afflicted with grief and mental sufferings"}
  - {planet: sun, house: 5, verse: 2, kind: bad, text: "he will have no sons and will be poor"}
  - {planet: sun, house: 6, verse: 2, kind: mixed, text: "the person will be powerful and be subjugated by his enemy",
     variant: "According to another reading, the person's enemies will meet with ruin; according to Satyacharya, such a person will be free from enemies, diseases and grief (translator's note)."}
  - {planet: sun, house: 7, verse: 3, kind: bad, text: "the person will suffer disgrace at the hands of women"}
  - {planet: sun, house: 8, verse: 3, kind: bad, text: "the person will have very few sons and will become blind"}
  - {planet: sun, house: 9, verse: 3, kind: good, text: "the person will have sons, wealth and comfort",
