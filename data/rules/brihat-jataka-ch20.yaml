  - {planet: sun, house: 10, verse: 3, kind: good, text: "the person will live in comfort and will be powerful"}
  - {planet: sun, house: 11, verse: 3, kind: good, text: "the person will be very rich"}
  - {planet: sun, house: 12, verse: 3, kind: bad, text: "he will become an apostate"}

