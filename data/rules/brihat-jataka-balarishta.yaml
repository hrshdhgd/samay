# Brihat Jataka chapter VI ("On Balarishta or Early Death"), verses 1-12 and the commentator's sixteen counter-yogas: dangers to a child at birth.
# Source: N. Chidambaram Iyer (tr.), Brihat Jataka of Varaha Mihira, Madras 1885, public domain, pp. 53-59. QUOTED, scan errors corrected against the Sanskrit
# (research/sources/gretil-brhajjataka.txt, BJ_06). Conditions are coded in samay/engine/balarishta_bj.py; research/notes/brihat-jataka-balarishta.md lists judgment calls and what was left out.
#
# MOST SENSITIVE (about a baby). Shown inside chart:longevity only after a warning and a tap (a stronger warning for a child). The chapter is the old book's list of dangers at birth, not a
# forecast, and the first twelve years cannot be judged (Phaladeepika 13.3). UNCHECKED: hidden until a person compares each row with the pages and sets level: translation-checked.
# Owner's decision 2026-11-12: nothing is hidden; a warning and approval come first.
verification: {level: unchecked}
edition: "tr. N. Chidambaram Iyer, Madras 1885"
pages: "53-59"
frame: "These are an old text's rules about dangers to a baby at birth. They are not a forecast: nothing here says what will or did happen, many of them fire in a good share of charts, and the book itself lists sixteen yogas that cancel them (shown below when they apply)."
rules:
  - {id: twilight, verse: "6.1", text: "If the birth occurs in the twilight when the lunar hora is rising and malefic planets occupy the last navamsas of signs, the child would die soon after birth", definition: "The Sun is in the 1st or the 7th house (near sunrise or sunset), the lagna is in a lunar hora, and the Sun, Mars and Saturn are each in the last navamsa (the last 3 deg 20 min) of their signs."}
  - {id: four_kendras, verse: "6.1", text: "If the Moon and three malefic planets occupy the four kendras, one in each, then also the child would die", definition: "The Moon, the Sun, Mars and Saturn stand one in each of the 1st, 4th, 7th and 10th houses."}
  - {id: east_west, verse: "6.2", text: "If Cancer or Scorpio rises and malefic planets occupy the eastern half of the zodiac while benefic planets occupy the western half, the child would die immediately after birth", definition: "The lagna is Cancer or Scorpio; the Sun, Mars and Saturn stand in the 10th, 11th, 12th, 1st, 2nd or 3rd house and Mercury, Jupiter and Venus in the 4th to 9th."}
  - {id: twelfth_second, verse: "6.2", text: "If malefic planets occupy the 12th and 2nd houses from the rising sign, the child would die", definition: "A malefic (Sun, Mars, Saturn) in the 12th house and a malefic in the 2nd."}
  - {id: sixth_eighth, verse: "6.2", text: "If malefic planets occupy the 6th and 8th houses from the rising sign, the child would die", definition: "A malefic in the 6th house and a malefic in the 8th."}
  - {id: three_signs, verse: "6.3", text: "If the rising sign, the setting sign and the sign occupied by the Moon are each occupied by a malefic planet and the Moon is not aspected by benefic planets, the child will die immediately after birth", definition: "A malefic in the lagna sign, one in the 7th sign and one in the Moon's sign, and no benefic (Mercury, Jupiter, Venus) aspects the Moon."}
  - {id: waning_twelfth, verse: "6.4", text: "If the waning Moon occupies the 12th house from the ascendant, malefic planets occupy the rising sign and the 8th house, and benefic planets do not occupy the kendras, the child will die immediately after birth", definition: "The Moon waning and in the 12th, a malefic in the lagna and one in the 8th, no benefic in the 1st, 4th, 7th or 10th."}
  - {id: moon_malefic_kendra, verse: "6.5", text: "If the Moon attended by a malefic planet occupies the rising sign or the 7th, 8th or 12th house, and benefic planets do not occupy the kendras, the child will die soon after birth", definition: "The Moon with a malefic in the same sign, in the 1st, 7th, 8th or 12th house, and no benefic in a kendra."}
  - {id: moon_sixth_eighth, verse: "6.6", text: "If the Moon occupies the 6th or the 8th house and a malefic planet aspects it, the child will die soon after birth; if a benefic planet alone aspects it, the child will die after 8 years; if both a benefic and a malefic aspect the Moon, the child will die 4 years after birth", definition: "The Moon in the 6th or 8th; the aspecting planets decide which of the three sentences applies; no aspect gives none."}
  - {id: lord_defeated, verse: "6.6", text: "If the lord of the rising sign occupies the 7th house and is defeated in planetary fight (conjunction) by a malefic planet, the child will die a month after birth", definition: "The lagna's lord in the 7th with a malefic in the same sign. 'Defeat' is read as the lord being the lesser light of the two (the translator's note lists the signs of the loser; not computed): shown when the two are within 1 degree."}
  - {id: waning_lagna, verse: "6.7", text: "If the waning Moon occupies the rising sign and malefic planets occupy the 8th house and the kendras, the child will die", definition: "The Moon waning in the lagna, a malefic in the 8th and malefics in the 4th, 7th and 10th."}
  - {id: moon_hemmed, verse: "6.7", text: "If the Moon occupies the 4th, 7th or 8th house and is between malefic planets, the child will die", definition: "The Moon in the 4th, 7th or 8th, with a malefic in the sign before hers and one in the sign after."}
  - {id: mother_too, verse: "6.7", text: "If the Moon occupies the rising sign between malefic planets, malefic planets occupy the 7th and 8th houses and powerful benefic planets fail to aspect the Moon, both the mother and the child will die (the translator: if they do aspect, the mother escapes and the child dies)", definition: "The Moon in the lagna with a malefic in the sign before and one in the sign after; malefics in the 7th and the 8th; no benefic aspecting her."}
  - {id: last_navamsa, verse: "6.8", text: "If the Moon occupies the last navamsa of a sign and is not aspected by benefic planets, the child will die soon after birth", definition: "The Moon in the last 3 deg 20 min of her sign and no benefic aspecting her."}
  - {id: fifth_ninth, verse: "6.8", text: "If malefic planets occupy the 5th and the 9th houses, the child will die soon after birth", definition: "A malefic in the 5th and a malefic in the 9th."}
  - {id: moon_lagna_seventh, verse: "6.8", text: "If the Moon occupies the rising sign and malefic planets occupy the 7th house, the child will die soon after birth", definition: "The Moon in the lagna and a malefic in the 7th."}
  - {id: luminary_lagna, verse: "6.9", text: "If the Sun or the Moon occupies the rising sign and malefic planets occupy the 5th, 8th and 9th houses, the child will die, if the Sun or the Moon is neither aspected nor accompanied by powerful benefic planets", definition: "The Sun or the Moon in the lagna; a malefic in each of the 5th, 8th and 9th; no benefic in its sign or aspecting it."}
  - {id: four_planets, verse: "6.10", text: "If Saturn, the Sun, the Moon and Mars occupy respectively the 12th, 9th, 1st and 8th houses, the child will die soon after birth if the planets are not aspected by powerful Jupiter", definition: "Saturn in the 12th, the Sun in the 9th, the Moon in the 1st, Mars in the 8th. Jupiter saves only if it is in the 5th and strong (the translator's note)."}
  - {id: moon_malefic_six, verse: "6.11", text: "If the Moon accompanied by a malefic planet occupies the 5th, 7th, 9th, 12th, 1st or 8th house, and she is neither accompanied nor aspected by powerful Venus, Mercury or Jupiter, the child will die soon after birth", definition: "The Moon with a malefic in one of those houses; none of Venus, Mercury, Jupiter in her sign or aspecting her while in an own, moolatrikona or exaltation sign. (Iyer prints 'nth'; the Sanskrit gives the 5th, suta.)"}
timing:
  verse: "6.12"
  text: "The death will occur when the Moon comes either to the sign occupied by the powerful planet causing such death, or to the sign she occupied at birth, or to the rising sign, provided the Moon is both powerful and aspected by powerful malefic planets; the Munis say the period for such death is a year (the translator: the Moon makes about 13 revolutions in a year)."
# The commentator's counter-yogas (translator's note after 6.12): each, when it holds, is shown as a mercy.
cancel:
  - {id: jupiter_lagna, text: "If powerful Jupiter occupies the rising sign, there will be no early death", definition: "Jupiter in the lagna in an own, moolatrikona or exaltation sign."}
  - {id: lagna_lord_strong, text: "If the lord of the rising sign is powerful, is not aspected by malefic planets and is aspected by benefic planets occupying the kendras, the child will live long", definition: "The lagna lord in an own, moolatrikona or exaltation sign, with no malefic aspecting it and a benefic in a kendra aspecting it."}
  - {id: moon_benefic_drekkana, text: "Even though the Moon occupies the 6th house, if she occupies the drekkana of Jupiter, Mercury or Venus there will be no early death", definition: "The Moon in the 6th and in a drekkana ruled by Jupiter, Mercury or Venus."}
  - {id: full_benefic, text: "If the Moon is full and between benefic planets there will be no early death", definition: "The Moon full (144 to 216 degrees from the Sun) with a benefic in the sign before hers and one in the sign after."}
  - {id: benefic_kendra, text: "If Mercury, Venus or Jupiter is powerful and occupies a kendra there will be no early death even if accompanied by a malefic", definition: "One of them in an own, moolatrikona or exaltation sign in the 1st, 4th, 7th or 10th."}
  - {id: day_night, text: "If the Moon is full, or the birth occurs by day when the Moon is waning or by night when she is waxing, there will be no early death even if the Moon is in the 6th or 8th house", definition: "The Moon full; or the Sun above the horizon (7th to 12th house) with the Moon waning; or the Sun below it with the Moon waxing."}
  - {id: full_jupiter, text: "If the Moon is full and is aspected by Jupiter occupying a kendra there will be no early death", definition: "The Moon full, Jupiter in a kendra aspecting her."}
  - {id: rahu_benefic, text: "If Rahu occupies the 3rd, 6th or 11th house and is aspected by benefic planets there will be no early death", definition: "Rahu in the 3rd, 6th or 11th and a benefic aspecting its sign."}
  - {id: sirodaya, text: "If all the planets occupy the Sirodaya signs there will be no early death", definition: "All seven planets in Gemini, Leo, Virgo, Libra, Scorpio or Aquarius."}
