# Brihat Jataka chapter XXI ("On the Planets in the Several Vargas"), verses 1-10: what the planets' dignity in signs, horas, drekkanas, the rising navamsa and the
# trimsamsas says of a person. Source: N. Chidambaram Iyer (tr.), Brihat Jataka of Varaha Mihira, Madras 1885, public domain, pp. 186-191 (scan page numbers are
# partly misread). QUOTED, scan errors corrected, the translator's notes applied where they define a term (research/notes/brihat-jataka-vargas.md).
#
# UNCHECKED: nothing is shown until a person compares each row with the pages and sets level: translation-checked with checked_by, checked_on and against.
# Owner's decision 2026-11-12: nothing is hidden, rows are shown as the book gives them.
#
# Left out on purpose (research/notes/brihat-jataka-vargas.md): the rising dwadasamsa remark (21.7, "the same effects as the rising signs": too vague to code), the
# Yavana/Vishnugupta dispute over an Aquarius dwadasamsa (21.3), and the case the translator says the author missed in 21.5 is coded as he infers it.
verification: {level: translation-checked, checked_by: h2, checked_on: 2026-11-13, against: "tr. N. Chidambaram Iyer, Madras 1885"}
edition: "tr. N. Chidambaram Iyer, Madras 1885"
pages: "186-191"

caution: "These are an old text's pointers, not a forecast. Where several rows apply to one chart they can seem to disagree; the book simply lists them."

# Verse 1: the number of the seven planets (Sun to Saturn) in their own signs, and in friendly signs.
own_signs:
  verse: "21.1"
  counts:
    1: "such a person will possess the average dignity of the members of his family"
    2: "the person will be an important member of his family"
    3: "the person will be respected by his kinsmen"
    4: "the person will be rich"
    5: "the person will live in comfort"
    6: "the person will live in luxurious ease and be as happy as a king"
    7: "the person will become a king"
friendly_signs:
  verse: "21.1"
  counts:
    1: "the person will lead a dependent life"
    2: "he will be protected by his friends"
    3: "he will be protected by his kinsmen"
    4: "he will be protected by his brothers and cousins"
    5: "the person will be a master over many people"
    6: "he will become a commander of an army"
    7: "he will become a king"
# Verse 2: exalted planets with a friend, and planets in inimical or depression signs.
exalted:
  verse: "21.2"
  aspected: "a single planet in its exaltation sign and aspected by a friendly planet: such a person will become a king"
  accompanied: "a planet in its exaltation sign and accompanied by a friendly planet: the person will become very rich and will be universally respected"
weak_signs:
  verse: "21.2"
  counts:
    1: "the person will become poor"
    2: "the person will become afflicted with grief"
    3: "the person will become a fool"
    4: "the person will become afflicted with diseases"
    5: "the person will suffer imprisonment"
    6: "the person will be a victim to much grief"
    7: "he will subject to torture persons who ought not to be tortured"
# Verse 3 (Satyacharya).
aquarius_lagna:
  verse: "21.3"
  text: "According to Satyachariar a person born when Aquarius is the rising sign will not be happy"
# Verses 4-5: horas. A sign's two horas of 15 degrees: odd signs solar then lunar, even signs lunar then solar (1.11).
horas:
  verse: "21.4–5"
  malefic: "malefic planets in the solar horas of odd signs: the person will be of wide-spread fame, will do important deeds, will be powerful, healthy and of bright appearance"
  benefic: "benefic planets in the lunar horas of even signs: the person will be of gentle manners and of bright appearance; will live in comfort, will be liked by all; will be intelligent and of sweet speech"
  moderate: "The book says that if the horas are as stated but the signs are different, the person will be all of this in a moderate degree; if both the horas and the signs are different the effects fail."
  note: "Read here as all three malefics (Sun, Mars, Saturn) or all three benefics (Mercury, Jupiter, Venus), the Moon left out; the text does not say which planets count."
# Verse 6: the Moon in a drekkana (the lords of a sign's three drekkanas are the lords of that sign, the 5th and the 9th from it, 1.11).
moon_drekkana:
  verse: "21.6"
  good: "the Moon in her own drekkana or a friendly drekkana: the person will be of very fine beauty and of well-known virtues"
  neutral: "the lord of the Moon's drekkana is neutral to her: the person will be what is stated, in a moderate degree (the translator's note)"
  kinds:
    sarpa: {text: "the Moon in a Sarpa (serpent) drekkana: the person will be wicked", where: {3: [2], 7: [1], 11: [3]}}
    ayudha: {text: "the Moon in an Ayudha (weapon) drekkana: the person will do deeds of torture", where: {0: [1, 3], 2: [2], 4: [1], 6: [2], 10: [1]}}
    chatushpad: {text: "the Moon in a Chatushpad (quadruped) drekkana: the person will cohabit with his preceptor's wife", where: {0: [2], 1: [2, 3], 3: [1], 6: [3], 7: [3], 8: [1]}}
    pakshi: {text: "the Moon in a Pakshi (bird) drekkana: the person will be of wandering habits", where: {0: [2], 2: [2], 4: [1], 6: [2]}}
  several: "If the Moon's drekkana is of more than one kind, the person will be all that is stated for each."
# Verse 7: the rising navamsa (a navamsa of a different sign from the rising sign), and the vargottama case (the same sign) where the person is chief of the class.
rising_navamsa:
  verse: "21.7"
  Aries: "a thief"
  Taurus: "one who enjoys away his earnings"
  Gemini: "learned"
  Cancer: "wealthy"
  Leo: "a king"
  Virgo: "hermaphrodite"
  Libra: "bold in fight"
  Scorpio: "one who earns his livelihood by carrying loads"
  Sagittarius: "a slave"
  Capricorn: "a sinner"
  Aquarius: "wicked"
  Pisces: "fearless"
  vargottama: "But if the rising navamsa is at the same time a vargottama navamsa the person born will be the chief of the respective class of persons (the translator: for instance, the chief of thieves)."
# Verses 8-10: a planet in its own trimsamsa, and the Sun or the Moon in another planet's trimsamsa. Trimsamsa: 5, 5, 8, 7, 5 degrees for Mars, Saturn, Jupiter, Mercury,
# Venus in an odd sign, reversed in an even sign (1.7).
trimsamsa_own:
  mars: {verse: "21.8", text: "a person born when Mars occupies his own trimsamsa will be a married man, will be powerful, will wear ornaments, will be generous, will be of bright appearance and will thoughtlessly engage in work"}
  saturn: {verse: "21.8", text: "a person born when Saturn occupies his own trimsamsa will be afflicted with diseases; his wife will die before him, he will be wicked, will covet the wives of other men, will be afflicted with grief, will have a house, clothes, attendants and the like and will be dirty"}
  jupiter: {verse: "21.9", text: "a person born when Jupiter occupies his own trimsamsa will be rich, famous, happy, intelligent, of bright appearance, universally respected, free from diseases, of active habits and will live in luxury"}
  mercury: {verse: "21.9", text: "a person born when Mercury occupies his own trimsamsa will be intelligent and learned in the fine arts; will be a fop, a literary author, of distinct speech, will be skilled in carpentry and the like, will follow the rules of life laid down by sages, will commence bold projects and will be much respected"}
  venus: {verse: "21.10", text: "a person born when Venus occupies his own trimsamsa will have many sons, will live in comfort, will be free from diseases, will love mankind, will be rich, beautiful, wicked, of fair body and will enjoy many women"}
trimsamsa_lights:
  mars: {sun: "the trimsamsa of Mars is occupied by the Sun: the person will be bold in fight", moon: "the trimsamsa of Mars is occupied by the Moon: the person will be slow at work"}
  saturn: {sun: "the trimsamsa of Saturn is occupied by the Sun: the person will be wicked", moon: "the trimsamsa of Saturn is occupied by the Moon: the person will indulge in acts of torture"}
  jupiter: {sun: "the trimsamsa of Jupiter is occupied by the Sun: the person will be of good disposition", moon: "the trimsamsa of Jupiter is occupied by the Moon: the person will become rich"}
  mercury: {sun: "the trimsamsa of Mercury is occupied by the Sun: the person will live in comfort", moon: "the trimsamsa of Mercury is occupied by the Moon: the person will be learned"}
  venus: {sun: "the trimsamsa of Venus is occupied by the Sun: the person will possess a fine body", moon: "the trimsamsa of Venus is occupied by the Moon: the person will be liked by the people"}
  verse: "21.10"
