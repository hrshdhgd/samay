  Gemini:      {mars: "sell weapons", mercury: "become a king", jupiter: "be learned", venus: "be fearful", saturn: "be a weaver", sun: "be poor"}
  Cancer:      {mars: "be a valiant soldier", mercury: "be a literary author", jupiter: "be learned", venus: "be a king", saturn: "live by weapons", sun: "suffer from diseases of the eye"}
  Leo:         {mars: "be a king", mercury: "be an astrologer", jupiter: "be rich", venus: "be a king", saturn: "be a barber", sun: "be a king"}
