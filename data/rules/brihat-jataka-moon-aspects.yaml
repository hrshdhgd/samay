  venus:   {sun: "be a fool", mars: "be fond of the wives of other men", mercury: "produce good literary works", jupiter: "produce good literary works", venus: "be fond of comforts", saturn: "unite with the wives of other men"}
  mercury: {sun: "be a duellist or a dancer", mars: "be a thief", mercury: "be a great poet", jupiter: "be a minister", venus: "be skilled in music", saturn: "be skilled in mechanical arts"}
  moon:    {sun: "be of small body", mars: "be a niggard and will possess small wealth", mercury: "practise austerities", jupiter: "be a chief", venus: "thrive by women", saturn: "be fond of work"}
  sun:     {sun: "be a man of angry temper", mars: "be liked by the king", mercury: "become rich by the discovery of hidden treasure", jupiter: "carry his orders into effect", venus: "have no sons", saturn: "do wicked deeds"}
