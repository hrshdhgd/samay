# Brihat Jataka chapter XIX ("On Planetary Aspects"), verses 1-9: what a person is like when the Moon, in a given sign or navamsa, is
# aspected by each planet. Source: N. Chidambaram Iyer (tr.), Brihat Jataka of Varaha Mihira, Madras 1885, public domain, pp. 175-180.
# QUOTED, scan errors corrected (research/notes/moon-aspects.md). Each text continues "...and be aspected by Mars, the person will ...".
# Cross-checked against Phaladeepika 18.6-15 (Kapoor): wherever the translation's list is complete it agrees; it drops items in six places,
# so it is used only as confirmation.
#
# UNCHECKED: nothing here is shown by the bot until a person compares each row with the pages above and sets level: translation-checked
# with checked_by, checked_on and against. Owner's decision 2026-11-12: nothing is hidden.
verification: {level: unchecked}
edition: "tr. N. Chidambaram Iyer, Madras 1885"
pages: "175-180"

# Which planets aspect which signs: Brihat Jataka II.13. All planets aspect the 7th from themselves fully; Saturn also the 3rd and 10th,
# Jupiter the 5th and 9th, Mars the 4th and 8th. The lesser sights (quarter, half, three-quarters) are not used. Houses are counted from
# the aspecting planet's sign to the Moon's.
aspect_rule:
  verse: "2.13"
  text: "All the planets aspect the 3rd and 10th houses with a quarter sight, the 5th and 9th houses with half a sight, the 4th and 8th houses with three-quarters of a sight, and the 7th house with a full sight; but Saturn aspects the 3rd and 10th houses with a full sight; Jupiter aspects the 5th and 9th houses with a full sight, and Mars aspects the 4th and 8th houses with a full sight."
  full: {sun: [7], moon: [7], mercury: [7], venus: [7], mars: [4, 7, 8], jupiter: [5, 7, 9], saturn: [3, 7, 10]}

# Verse 9 (and its notes): how much of these effects comes to pass.
degree:
  verse: "19.9"
  text: "If the Moon occupy a Vargottama position, her own Navamsa, or other Navamsas and be aspected by benefic planets, the effects will respectively be full, imperfect and small. But if she be aspected by malefic planets, the effects will respectively be small, imperfect and full. If the lord of the Navamsa be powerful, the effects described for planetary aspects in the case of signs and Navamsas will alone come to pass."
  rising_sign: "The same remark applies to the rising sign and to the Sun (the translator's note)."

