  Libra:       {mars: "be a chief and will work mischief", mercury: "be a king", jupiter: "work in gold", venus: "be a trader", saturn: "be a chief and will work mischief", sun: "be a chief and will work mischief"}
  Scorpio:     {mars: "be a king", mercury: "get twins", jupiter: "be obedient", venus: "be a washerman", saturn: "be of defective limbs", sun: "be poor"}
  Sagittarius: {mars: "be a fop, will put on a show of virtue and will not attend to the work of other persons", mercury: "protect his kinsmen", jupiter: "be a king", venus: "protect many men", saturn: "be a fop, will put on a show of virtue and will not attend to the work of other persons", sun: "be a fop, will put on a show of virtue and will not attend to the work of other persons"}
