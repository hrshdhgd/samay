  Aquarius:    {mars: "be fond of the wives of other men", mercury: "be a king", jupiter: "resemble a king", venus: "be fond of the wives of other men", saturn: "be fond of the wives of other men", sun: "be fond of the wives of other men"}
  Pisces:      {mars: "do wicked deeds", mercury: "be witty", jupiter: "be a king", venus: "be learned", saturn: "do wicked deeds", sun: "do wicked deeds"}
# Where the text gives one result for "Saturn, the Sun or Mars" (Virgo, Libra, Sagittarius, Aquarius with Venus too, Pisces): the same
# words are repeated for each planet above. Verses 2 and 3.
shared_results:
  Virgo: [saturn, sun, mars]
  Libra: [saturn, sun, mars]
  Sagittarius: [saturn, sun, mars]
  Aquarius: [venus, saturn, sun, mars]
  Pisces: [saturn, sun, mars]

# Verses 5-8: the Moon in a navamsa (by the planet that rules the navamsa sign), aspected by each planet. "The Navamsa of Cancer"
# is the Moon's own, "of Leo" the Sun's.
