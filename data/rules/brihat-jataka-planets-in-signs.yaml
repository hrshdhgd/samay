# Brihat Jataka chapter XVIII ("On the Sun, Mars and other planets in the several signs of the zodiac"), verses 1-19: what a person is like with each of the Sun, Mars, Mercury,
# Jupiter, Venus and Saturn in each sign. Source: N. Chidambaram Iyer (tr.), Brihat Jataka of Varaha Mihira, Madras 1885, public domain (archive.org b2488442x), pp. 165-171.
# QUOTED, scan errors corrected (research/notes/brihat-jataka-planets-in-signs.md). Each text continues "A person born with the <planet> in <sign> will be ...".
#
# UNCHECKED: nothing is shown until a person compares each row with the pages and sets level: translation-checked with checked_by, checked_on and against.
# Owner's decision 2026-11-12: nothing is hidden.
verification: {level: translation-checked, checked_by: h2, checked_on: 2026-11-13, against: "tr. N. Chidambaram Iyer, Madras 1885"}
edition: "tr. N. Chidambaram Iyer, Madras 1885"
pages: "165-171"

# Verse 1's translator's note (a): the Sun in the exaltation degree gives a different reading from the one in verse 1 ("not in its exaltation degree").
sun_exaltation_degree:
  verse: "18.1 (note a)"
  text: "will be very rich, will remain for ever in a place, will have servants carrying arms, will be of great fame and able"
  from_degree: 9.0   # the 10th degree of Aries is the deep-exaltation point (Phaladeepika 1.6); the 10th degree is used here for "the exaltation degree"
  to_degree: 10.0
# The text's own conditions on how much of this comes to pass: chapter XVII verse 13 ("the same remark applies to planets other than the Moon", i.e. these) and verse 20 of this chapter.
condition:
  verse: "18.20 and 17.13"
  text: "The effects given for the signs hold also when the planet is in the rising sign, and more is due to the rising sign and the other houses; if the houses and their lords are powerful these effects come to pass fully. The translator refers to chapter XVII verse 13: they come to pass fully only if the planet, the sign it is in and the lord of that sign are all powerful; with two of the three, imperfectly; with one, still more imperfectly; with none, not at all."
# Aquarius for Jupiter says "all that has been said of the Moon in Cancer" (chapter XVII); that text is brihat-jataka-moon.yaml's sign 4.
planets:
  sun:
    Aries: {verse: "1", text: "of wide-spread fame, able, of wandering habits, possessed of small wealth and will carry weapons"}
    Taurus: {verse: "1", text: "one who will deal in cloths, perfumes and other articles, will hate women and will be skilled in music"}
    Gemini: {verse: "2", text: "learned in grammar, will be an Astrologer and will be rich"}
    Cancer: {verse: "2", text: "independent, fierce, poor, will do the work of other people and will suffer from the fatigue of foot-journey"}
    Leo: {verse: "2", text: "fond of living in forests, mountains and cow-sheds, will be powerful and will be a fool"}
    Virgo: {verse: "2", text: "skilled in writing, painting, in literary productions and in mathematics, and will possess a body resembling that of a woman"}
    Libra: {verse: "3", text: "fond of liquor or will manufacture it, will be of a wandering nature, will be an alchemist and will do wicked deeds"}
    Scorpio: {verse: "3", text: "of a fierce nature, will thoughtlessly engage in work, will earn money by acts connected with poison and will be vastly learned in the use of arms"}
    Sagittarius: {verse: "3", text: "respected by sages, will be rich and independent and will be learned in medicine and sculpture"}
    Capricorn: {verse: "4", text: "one who will engage in deeds unsuited to his rank in life, will be ignorant, will deal in mean articles, will possess small wealth, will be avaricious and will enjoy the property of other men"}
    Aquarius: {verse: "4", text: "one who will engage in deeds unsuited to his rank in life, will be poor and will have no sons"}
    Pisces: {verse: "4", text: "one who will become rich by dealing in the produce of water, will be respected by women, will possess a mole or other marks in the part of body corresponding to the sign occupied by the Sun and Moon together"}
