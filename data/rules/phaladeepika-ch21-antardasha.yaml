# brings in each mahadasha. all 81 combinations.
# Source: Mantreswara's Phala Deepika, tr. Dr. G. S. Kapoor (in copyright), openly available at
# http://www.panchanga.lv/wp-content/uploads/2020/06/Phaladipika_Shri-Mantreswara.pdf, printed pages 197-207
# (PDF pages 196-206). The repository is public, so every result is PARAPHRASED, never quoted. Notes and the omissions
# are in research/notes/phaladeepika-ch21-antardasha.md.
#
# UNCHECKED: nothing here is shown by the bot until a person compares each row with the pages above and sets
# level: translation-checked with checked_by and checked_on. Owner's decision 2026-11-12: nothing is hidden for being
# unpleasant; a checker only confirms each row matches the text.
verification: {level: translation-checked, checked_by: h2, checked_on: 2026-11-13, against: "tr. G. S. Kapoor (Ranjan Publications)"}
edition: "tr. G. S. Kapoor (Ranjan Publications)"
pages: "197-207"

# Verse 1 and the translator's notes (Kapoor, not Mantreswara): the good results show when the planet is well placed in
# the chart and the bad ones when it is badly placed. Verse 84: judge the person's status, class, work and appearance too.

# Cross-checked 2026-11-12 against a second, Sanskrit-with-translation edition (wisdomlib.org, Phaladipika, Adh. XXI, 1950): its
# sloka 67 is the Venus bhukti in Ketu's dasa ("Sukra's Bhukti in Ketu's Mahadasa") and its sloka 74 the Mercury bhukti ("Mercury's
# Bhukti in Ketu's Mahadasa"). Kapoor's translation cuts off verse 67's heading and mislabels verse 74 as Venus; the contents of
# both verses agree with the second edition, so they are used here under the correct planets.
# Verse 50 reads "antar dasa of Ketu in the dasa of Jupiter" in Kapoor but sits in the Saturn block; the standard order of
# sub-chapters (Saturn, Mercury, Ketu, Venus, Sun, Moon, Mars, Rahu, Jupiter) puts Ketu there, and that is what is used.
#  - Verse 33 ends in a garbled phrase ("skilful Mercury"); verse 52 ends "loss of wealth and rains". Both are
#    paraphrased up to the clear part.
