# Brihat Jataka chapter XXIII ("On Malefic Yogas"), verses 1-17: the old book's list of afflictions: wife and sons, marriage, disease, disability, servitude and imprisonment.
# Source: N. Chidambaram Iyer (tr.), Brihat Jataka of Varaha Mihira, Madras 1885, public domain, pp. 193-200. QUOTED, scan errors corrected against the Sanskrit
# (research/sources/gretil-brhajjataka.txt), the translator's notes applied where they define a term. Conditions are coded in samay/engine/malefic_yogas.py; every rule has a
# `definition` sentence for the checker. Notes and what was left out: research/notes/brihat-jataka-malefic-yogas.md.
#
# THIS IS SENSITIVE. It is shown only after the person has read a warning and tapped to approve it (and, for a child, a stronger warning). It is an old text's rules, not a forecast,
# and it speaks of "a person's wife" because it was written for a man; the bot applies it as asked, whoever the person is.
# UNCHECKED: nothing is shown until a person compares each row with the pages and sets level: translation-checked with checked_by, checked_on and against.
# Owner's decision 2026-11-12: nothing is hidden; a warning and approval come first (a consent gate in the bot).
verification: {level: unchecked}
edition: "tr. N. Chidambaram Iyer, Madras 1885"
pages: "193-200"

frame: "These are an old text's lists of ill omens, not a forecast. It was written for a man (it says a person's wife), many rules overlap and some fire in a large share of charts, and no one can say what happens in a life from them."

# Malefic planets here: Sun, Mars, Saturn (and the Moon where the translator names the four: the rules of the blind, the deaf and the imprisoned).
# Benefic: Mercury, Jupiter, Venus. A planet "aspects" by the full aspects of II.13 (Mars 4, 7, 8; Jupiter 5, 7, 9; Saturn 3, 7, 10; every other the 7th).
rules:
  - {id: sons, verse: "23.1", text: "If the 5th house from the ascendant or from the Moon is occupied or aspected by benefic planets or by its lord, such a person will have sons", definition: "The 5th sign from the lagna or the 5th from the Moon holds Mercury, Jupiter or Venus, or is aspected by one of them, or holds or is aspected by its own lord."}
  - {id: no_sons, verse: "23.1", text: "If the 5th house from the ascendant and the 5th from the Moon are not occupied or aspected by benefic planets or by their lords, he will not have sons (the translator's note)", definition: "Neither the 5th from the lagna nor the 5th from the Moon holds or is aspected by a benefic or its own lord."}
  - {id: wife, verse: "23.1", text: "If the 7th house from the ascendant or from the Moon is occupied or aspected by benefic planets or by its lord, such a person will have a wife", definition: "As for sons, with the 7th from the lagna or the 7th from the Moon."}
  - {id: no_wife, verse: "23.1", text: "If the 7th house from the ascendant and the 7th from the Moon are not occupied or aspected by benefic planets or by their lords, he will not have a wife (the translator's note)", definition: "Neither the 7th from the lagna nor the 7th from the Moon holds or is aspected by a benefic or its own lord."}
  - {id: virgo_wife, verse: "23.1", text: "If Virgo is the rising sign and the Sun occupies it, the person will lose his wife, provided Saturn occupies Pisces at the same time", definition: "Lagna Virgo, the Sun in Virgo, Saturn in Pisces."}
  - {id: virgo_sons, verse: "23.1", text: "If Virgo is the rising sign and the Sun occupies it, the person will lose his sons, if Mars occupies Capricorn at the same time", definition: "Lagna Virgo, the Sun in Virgo, Mars in Capricorn."}
  - {id: moon_saturn_seventh, verse: "23.1", text: "If the Moon and Saturn occupy the 7th house, a person's wife will quit him and marry another", definition: "The Moon and Saturn both in the 7th house from the lagna."}
  - {id: wives_number, verse: "23.1", text: "If the 7th house is aspected by the Moon and Saturn, the number of wives of a person will be the number represented by the navamsa occupied by the lord of the 7th house, counting from the navamsa of Aries", definition: "The 7th sign is aspected by both the Moon and Saturn; the number is that of the navamsa sign of the 7th lord (Aries 1 ... Pisces 12)."}
  - {id: single_wife, verse: "23.1", text: "If Jupiter, or the Moon and Venus, occupy the 7th house and the navamsa of the Sun or Mars, the person will have a single wife", definition: "Jupiter, or both the Moon and Venus, in the 7th house and in a navamsa of Aries, Leo or Scorpio (a navamsa of the Sun or Mars)."}
  - {id: several_wives, verse: "23.1", text: "If the 7th house is aspected by the Moon and Venus, the person will have several wives", definition: "The 7th sign is aspected by both the Moon and Venus."}
  - {id: wife_fire, verse: "23.2", text: "If malefic planets occupy the 4th and 8th houses from Venus, the person's wife will die by fire", definition: "A malefic (Sun, Mars, Saturn) in the 4th sign from Venus and a malefic in the 8th, and Venus in an Agni (fiery) drekkana (the translator's proviso, read from chapter XXVII's images: the 1st drekkana of Taurus and the 2nd of Aquarius, which carry fire).", proviso: "Venus is in a fiery (Agni) drekkana, the translator's proviso"}
  - {id: wife_fall, verse: "23.2", text: "If malefic planets are on both sides of Venus, the person's wife will die by a fall", definition: "A malefic in the sign before Venus and a malefic in the sign after, and Venus in a Nipata (falling) drekkana (the translator's proviso, read from chapter XXVII: the 2nd drekkana of Libra, whose figure is about to fall, and the 3rd of Pisces, whose figure stands on the brink of a pit).", proviso: "Venus is in a falling (Nipata) drekkana, the translator's proviso"}
  - {id: wife_rope, verse: "23.2", text: "If Venus is not accompanied or aspected by benefic planets, the person's wife will die by ropes", definition: "No benefic (Mercury, Jupiter) in Venus's sign or aspecting it, and Venus in a Pasa (rope) drekkana (the translator's proviso: the 1st drekkana of Capricorn, 23.16 note).", proviso: "Venus is in a rope (Pasa) drekkana, the translator's proviso"}
  - {id: one_eye, verse: "23.3", text: "If one of the two houses, the 12th and the 6th from the ascendant, is occupied by the Sun and the other by the Moon, the person and his wife will each have a single eye", definition: "The Sun in the 12th and the Moon in the 6th from the lagna, or the Moon in the 12th and the Sun in the 6th."}
  - {id: limbs_venus_sun, verse: "23.3", text: "If Venus and the Sun occupy one of the three houses, the 7th, the 9th and the 5th from the ascendant, the person will be of defective limbs", definition: "Venus and the Sun in the same house, and that house the 5th, 7th or 9th from the lagna. (The translator notes that some say the Moon, not Venus; the Sanskrit speaks of a wife of defective limbs.)"}
  - {id: barren_wife, verse: "23.4", text: "If Saturn occupies the rising sign and Venus occupies the chakra-sandhi navamsa and the 7th house, the person's wife will be barren, provided the 5th house is not occupied by benefic planets", definition: "Saturn in the lagna; Venus in the 7th house and in the last navamsa (26 deg 40 min to 30 deg) of Cancer, Scorpio or Pisces; no benefic (Mercury, Jupiter) in the 5th."}
  - {id: neither_wife_nor_sons, verse: "23.4", text: "If malefic planets occupy the 12th and the 7th houses and the ascendant, and the waning Moon occupies the 5th house, the person will have neither wife nor sons", definition: "A malefic (Sun, Mars, Saturn) in each of the 12th, the 7th and the 1st houses, and the Moon waning in the 5th."}
  - {id: adultery, verse: "23.5", text: "If Venus occupies the 7th house from the ascendant, in the varga of Saturn or Mars, and is aspected by Saturn or Mars, the person will commit adultery", definition: "Venus in the 7th house, in a sign or a navamsa of Mars or Saturn, aspected by Mars or Saturn."}
  - {id: adultery_both, verse: "23.5", text: "If Venus is in the varga of Saturn or Mars and aspected by Saturn or Mars, and the Moon, Saturn and Mars occupy the 7th house from the ascendant, both the man and his wife will commit adultery", definition: "Venus in a sign or a navamsa of Mars or Saturn and aspected by Mars or Saturn, and the Moon, Saturn and Mars all in the 7th house."}
  - {id: neither_wife_nor_sons_venus_moon, verse: "23.5", text: "If Venus and the Moon occupy a sign and Saturn and Mars occupy the 7th house from the ascendant, the person will have neither wife nor sons", definition: "Venus and the Moon in one sign, Saturn and Mars both in the 7th house from the lagna."}
  - {id: late_marriage, verse: "23.5", text: "If male and female planets occupy a sign, Saturn and Mars occupy the 7th house from the ascendant and are aspected by benefic planets, the person's wife will be of advanced age and the man will marry late in life", definition: "A male planet (Sun or Jupiter) and a female planet (Moon or Venus) in one sign; Saturn and Mars both in the 7th house; a benefic (Mercury, Jupiter, Venus) aspecting the 7th."}
  - {id: destroys_family, verse: "23.6", text: "If the Moon occupies the 10th house, Venus the 7th house and the malefic planets the 4th house, such a person will destroy his family (the translator: the family will become extinct with him)", definition: "The Moon in the 10th house, Venus in the 7th and a malefic (Sun, Mars, Saturn) in the 4th."}
  - {id: servant_son, verse: "23.6", text: "If Venus occupies the 12th house from the ascendant and the navamsa of Saturn, the person will be the son of a serving woman", definition: "Venus in the 12th house and in a navamsa of Capricorn or Aquarius."}
  - {id: low_deeds, verse: "23.6", text: "If the Sun and the Moon occupy the 7th house and are aspected by Saturn, the person will do deeds unsuited to his rank in life", definition: "The Sun and the Moon both in the 7th house and Saturn aspecting that sign."}
  - {id: swelling, verse: "23.7", text: "If Venus and Mars occupy the 7th house from the ascendant and are aspected by malefic planets, such a person will be afflicted with swelling illness (the translator: such as elephantiasis)", definition: "Venus and Mars both in the 7th house and aspected by a malefic (Sun or Saturn)."}
  - {id: genital, verse: "23.7", text: "If the Moon occupies the navamsa of Cancer or Scorpio and is accompanied by malefic planets, the person will be afflicted with diseases of the genital organs", definition: "The Moon in a navamsa of Cancer or Scorpio and in the same sign as a malefic (Sun, Mars, Saturn)."}
  - {id: white_leprosy, verse: "23.7", text: "If the Moon occupies the ascendant, Saturn and Mars occupy the 12th and 2nd houses and the Sun the 7th house, the person will be afflicted with white leprosy", definition: "The Moon in the lagna, Saturn and Mars in the 12th and 2nd (either way round), the Sun in the 7th."}
  - {id: limbs_moon_mars_saturn, verse: "23.7", text: "If the Moon occupies the 10th house from the ascendant, Mars the 7th house and Saturn the 2nd house from the Sun, such a person will be of defective limbs", definition: "The Moon in the 10th house, Mars in the 7th, Saturn in the sign after the Sun's."}
  - {id: asthma, verse: "23.8", text: "If the Moon occupies a place between Saturn and Mars and the Sun occupies the sign Capricorn, such a person will be afflicted with asthma, consumption and diseases of the spleen", definition: "Saturn in the sign before the Moon and Mars in the sign after, or the other way round, and the Sun in Capricorn."}
  - {id: pulmonary, verse: "23.8", text: "If the Sun occupies the sign or the navamsa of the Moon, the person will be afflicted with pulmonary consumption", definition: "The Sun in Cancer or in a navamsa of Cancer. (The Sanskrit reads as the Sun and Moon each in the other's sign or navamsa; the translation is followed.)"}
  - {id: skeleton, verse: "23.8", text: "If the Sun and the Moon occupy together either Cancer or Leo, the person will be reduced to a skeleton", definition: "The Sun and the Moon in the same sign, Cancer or Leo."}
  - {id: leprosy_moon, verse: "23.9", text: "If the Moon occupies the 5th navamsa of Sagittarius, or the navamsa of Pisces, Cancer, Capricorn or Aries, and is either accompanied or aspected by Saturn and Mars, such a person will be afflicted with leprosy", definition: "The Moon in the navamsa of Leo within Sagittarius (the 5th navamsa), or in a navamsa of Pisces, Cancer, Capricorn or Aries (of any sign), and each of Saturn and Mars either in her sign or aspecting it."}
  - {id: leprosy_houses, verse: "23.9", text: "If the 5th or the 9th house from the ascendant is the sign Scorpio, Cancer, Taurus or Capricorn and is either occupied or aspected by Saturn and Mars, the person will also be afflicted with leprosy", definition: "The 5th or the 9th sign from the lagna is Scorpio, Cancer, Taurus or Capricorn, and each of Saturn and Mars is in it or aspects it."}
  - {id: blind, verse: "23.10", text: "If the Sun, the Moon, Mars and Saturn occupy the 8th, 6th, 2nd and 12th houses in any way, such a person will become blind by causes pertaining to the most powerful of the four planets", definition: "The Sun, the Moon, Mars and Saturn stand one each in the 8th, 6th, 2nd and 12th houses from the lagna, in any order."}
  - {id: deaf, verse: "23.11", text: "If the malefic planets (the Sun, the Moon, Mars and Saturn) occupy the 9th, 11th, 3rd and 5th houses and are not aspected by benefic planets, such a person will become deaf by causes pertaining to the most powerful planet", definition: "The Sun, the Moon, Mars and Saturn stand one each in the 9th, 11th, 3rd and 5th houses, in any order, and no benefic (Mercury, Jupiter, Venus) aspects any of them."}
  - {id: deformed_teeth, verse: "23.11", text: "If such malefic planets occupy the 7th house from the ascendant, the person will be of deformed teeth", definition: "Any of the Sun, Mars and Saturn in the 7th house, not aspected by a benefic (the translator: while not aspected by benefic planets)."}
  - {id: windy, verse: "23.13", text: "If Saturn occupies the 7th house and Jupiter the ascendant, such a person will be afflicted with windy complaints", definition: "Saturn in the 7th house and Jupiter in the lagna."}
  - {id: insane, verse: "23.13", text: "If Mars occupies the 7th house and Jupiter the ascendant, the person will become insane", definition: "Mars in the 7th house and Jupiter in the lagna."}
  - {id: idiot_saturn_mars, verse: "23.13", text: "If Saturn occupies the ascendant and Mars occupies the 5th, 7th or 9th house, the person will become an idiot", definition: "Saturn in the lagna and Mars in the 5th, 7th or 9th house."}
  - {id: idiot_moon_saturn, verse: "23.13", text: "If the waning Moon and Saturn occupy the 12th house, the person will also become an idiot", definition: "The Moon waning (within 180 degrees before the Sun) and Saturn both in the 12th house."}
  - {id: servitude, verse: "23.14", text: "If one of the four planets (the lord of the navamsa occupied by the Moon, the Sun, the Moon and Jupiter) occupies the navamsa of the lord of its depression sign or an inimical navamsa, such a person will serve under other men for his livelihood; if two of the four, he will become a slave; if three or all four, the person will be the son of a slave", definition: "Of the lord of the Moon's navamsa, the Sun, the Moon and Jupiter, count those standing in a navamsa ruled by the lord of their own depression sign or by one of their natural enemies; one serves, two a slave, three or four a slave's son."}
  - {id: ugly_teeth, verse: "23.15", text: "If the rising sign is Taurus, Aries or Sagittarius and malefic planets aspect it, such a person will have ugly teeth", definition: "Lagna Aries, Taurus or Sagittarius and a malefic (Sun, Mars, Saturn) aspecting it."}
  - {id: bald, verse: "23.15", text: "If one of the malefic signs (Aries, Leo, Scorpio, Capricorn, Aquarius) or the sign Sagittarius or Taurus is the rising sign and is aspected by malefic planets, the person will be bald-headed", definition: "Lagna Aries, Leo, Scorpio, Capricorn, Aquarius, Sagittarius or Taurus, and a malefic (Sun, Mars, Saturn) aspecting it."}
  - {id: weak_sight, verse: "23.15", text: "If the Sun occupies the 9th or the 5th house from the ascendant and is aspected by malefic planets, the person will be of weak sight", definition: "The Sun in the 5th or 9th house and Mars or Saturn aspecting it."}
  - {id: various_diseases, verse: "23.15", text: "If Saturn occupies the 5th or the 9th house and is aspected by malefic planets, the person will be afflicted with various diseases", definition: "Saturn in the 5th or 9th house and the Sun or Mars aspecting it."}
  - {id: defective_limbs_mars, verse: "23.15", text: "If Mars occupies the 5th or the 9th house and is aspected by malefic planets, the person will be of defective limbs", definition: "Mars in the 5th or 9th house and the Sun or Saturn aspecting it."}
  - {id: imprisonment_houses, verse: "23.16", text: "If the malefic planets (the Sun, the Moon, Mars and Saturn) occupy the 12th, 5th, 2nd and 9th houses in any way, such a person will suffer imprisonment and restraint of the nature of the rising sign", definition: "The Sun, the Moon, Mars and Saturn stand one each in the 12th, 5th, 2nd and 9th houses, in any order."}
  - {id: imprisonment_drekkana, verse: "23.16", text: "If the rising drekkana is either a Sarpa (snake) drekkana or a Pasa (rope) drekkana and the sign of its lord is aspected by malefic planets, the person will also suffer imprisonment of the nature of such sign", definition: "The lagna is in a drekkana carrying a snake (Cancer 2nd or 3rd, Scorpio 1st or 2nd, Pisces 3rd; read from chapter XXVII) or the 1st drekkana of Capricorn (the rope), and the sign of that drekkana's lord is aspected by a malefic (Sun, Mars, Saturn)."}
  - {id: servant, verse: "23.17", text: "If the Sun, Saturn and Mars occupy the 10th house from the ascendant and are not aspected by benefic planets, the person will be a servant of varying rank (the translator: with one of the three in the 10th, dignified; two, of middle rank; three, of low rank)", definition: "The Sun, Mars and Saturn in the 10th house, counting those that stand there, none aspected by a benefic (Mercury, Jupiter, Venus)."}

# The translator's notes: the cause by the strongest planet (23.10), and the kind of imprisonment by the rising sign (23.16).
causes:
  moon: "phlegmatic affections"
  mars: "bilious affections"
  sun: "heat or wood"
  saturn: "windy affections, stones and the like"
imprisonment:
  rope: {signs: [Aries, Taurus, Sagittarius], text: "he will be bound with ropes"}
  fetters: {signs: [Gemini, Virgo, Libra, Aquarius], text: "he will be loaded with fetters"}
  fortress: {signs: [Cancer, Capricorn, Pisces], text: "he will be shut up in a fortress but will be taken care of"}
  cellar: {signs: [Scorpio], text: "he will be kept in a subterranean cellar"}
