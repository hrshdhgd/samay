# Brihat Jataka chapter XI ("On Raja yoga, or the birth of kings"): the configurations of the planets, stated plainly enough to be decided
# from a whole-sign chart, under which a person becomes a king (or, in a low family, rich). Source: N. Chidambaram Iyer (tr.), Brihat
# Jataka of Varaha Mihira, Madras 1885, public domain, pp. 112-120. QUOTED, scan errors corrected (research/notes/raja-yogas.md).
# What was left out (verses 2, 3, 15, 16, 17, 19, 20 and the translators' alternative readings) and why is in that note.
#
# UNCHECKED: nothing here is shown by the bot until a person compares each row with the pages above and sets level:
# translation-checked with checked_by, checked_on and against. Owner's decision 2026-11-12: nothing is hidden.
verification: {level: translation-checked, checked_by: h2, checked_on: 2026-11-13, against: "tr. N. Chidambaram Iyer, Madras 1885"}
edition: "tr. N. Chidambaram Iyer, Madras 1885"
pages: "112-120"

# Verse 12: "Persons born under the various yogas described above, though they may be born in low families will become kings. If such
# persons are born in a king's family they will doubtless become kings. We shall now proceed to describe certain yogas, persons born under
# which will become kings if they belong to a king's family and will become rich if otherwise."  Applies to verses 1-11 (first) and 13-18 (second).
family_notes:
  verse: "11.12"
  anyone: "Persons born under the various yogas described [in verses 1-11], though they may be born in low families will become kings. If such persons are born in a king's family they will doubtless become kings."
  royal_only: "Persons born under [these yogas] will become kings if they belong to a king's family and will become rich if otherwise."

# Verse 1 and the translator's notes (a) and (b): three or more planets in their exaltation signs.
exalted:
  verse: "11.1"
  malefic: "According to the Yavanas a person born when three or more malefic planets are in their exaltation signs becomes a tyrannical king. According to Jeevasarma, if such planets be malefic a person will never become a king; Varahamihira is of the opinion of the Yavanas (the translator's notes)."
  benefic: "If three or more planets occupying their exaltation signs be benefic, the person becomes a good king (the translator's note)."
  mixed: "If both benefic and malefic, he will become both a good and a bad king (the translator's note)."
  malefics: [sun, mars, saturn]
  benefics: [moon, mercury, jupiter, venus]

# Verse 13: three or more powerful planets in their own, exaltation or moolatrikona signs. 'Powerful' is not measured; the bot counts the planets in those signs.
strong_planets:
  verse: "11.13"
  three: "When three or more planets are powerful and occupy either their houses or exaltation signs or their Moolatrikona signs, a person born becomes a king if he belongs to a king's family."
  five: "When five or more planets are powerful and occupy their houses or exaltation signs or their Moolatrikona signs a person born becomes a king even if he be born in a low family. If in either case the number of powerful planets be less than three or five, the persons described above will not become kings but will become only rich."

