# Panchang conventions for the family. Every disputed choice lives here, not in code.
# `sampradaya` picks which tradition's day is the PRIMARY one (the other tradition's day is always shown as a named
# alternate). Set to smarta on 2026-11-22 (owner: family calendar unavailable, use credible online sources): this follows
# the Tulu Panchanga app for Mangaluru/Udupi, which gives the Smarta day with the Madhwa variant noted. Change it to
# madhva if the family's printed panchang follows the Madhwa (arunodaya) reckoning.
id: panchang-family
name: Family panchang conventions
sampradaya: smarta
ayanamsa: lahiri_mean
sunrise_definition: disc_centre   # upper_limb | disc_centre. Set 2026-11-22 to match the family calendar (Ekadashi 20 Nov 2026 at Mangaluru: tithi ends 06:32:01, centre sunrise 06:32:52, upper-limb 06:31:42). One date only; revisit when the other Ekadashi dates arrive.
# Measured 2026-11-21 by scripts/measure_margin.py (sunrise definition 2.27 min + 1' elongation 2.23 min + nutation 0.61 min,
# rounded up). Calculation spread only. Do not tune it to make a calendar comparison pass.
ambiguity_margin_minutes: 6
# `verified: true` means the rule was read against the located source below, and what the source does NOT say is stated.
observances:
  ekadashi:
    label: Ekadashi
    # Read 2026-11-22. Dharmasindhu (English summary, Kamakoti, chapter 3, "Tithi Nirnaya") reckons every tithi from
    # sunrise (a full tithi is one lasting 60 ghatikas after sunrise; vedha is measured from sunrise) and gives Ekadashi
    # a Dashami vedha of 15 ghatikas. NOT in that summary, taken instead from the Tulu Panchanga app's documented
    # convention (docs/VERIFY.md rows 12 and 15; 149 dates agree with this engine for 2026-27): the kshaya and vriddhi
    # tie-breaks, and the Madhva rule that a day is rejected when Dashami touches arunodaya (96 minutes before sunrise).
    verified: true
    source: {text: "Dharmasindhu, English summary (Kamakoti); Tulu Panchanga app docs/VERIFY.md", locus: "ch. 3 Tithi Nirnaya; VERIFY rows 12, 15"}
    rules:
      smarta: {tithis: [11, 26], anchor: sunrise, start_minutes: 0, end_minutes: 0, on_kshaya: start_day, on_vriddhi: first}
      madhva:
        tithis: [11, 26]
        anchor: sunrise
        start_minutes: 0
        end_minutes: 0
        on_kshaya: next_day
        on_vriddhi: first
        viddha: {tithis: [10, 25], anchor: sunrise, start_minutes: -96, end_minutes: 0}
  pradosha:
    label: Pradosha
    # Read 2026-11-22. Skanda Purana, Brahma Khanda (Dharmottara), chapter 6, v. 5 (tr. G. V. Tagare, wisdomlib): "the dusk
    # on the thirteenth lunar day is called Pradosha". Dharmasindhu (Kamakoti summary, ch. 3): the pradosha time is the three
    # muhurtas (3 x 48 = 144 minutes) following sunset. The Tulu Panchanga app uses sunset + 1/5 of the night (about 137 min).
    verified: true
    source: {text: "Skanda Purana, Brahma Khanda; Dharmasindhu English summary (Kamakoti)", locus: "Skanda ch. 6 v. 5; Dharmasindhu ch. 3"}
    rules:
      all: {tithis: [13, 28], anchor: sunset, start_minutes: 0, end_minutes: 144, on_kshaya: start_day, on_vriddhi: first}
  purnima:
    label: Purnima
    # Read 2026-11-22: same sunrise reckoning as Ekadashi (Dharmasindhu summary, ch. 3, which gives Purnima a Chaturdashi
    # vedha of 18 ghatikas, not applied here). Tie-breaks from the Tulu Panchanga app as above.
    verified: true
    source: {text: "Dharmasindhu, English summary (Kamakoti); Tulu Panchanga app docs/VERIFY.md", locus: "ch. 3 Tithi Nirnaya"}
    rules:
      all: {tithis: [15], anchor: sunrise, start_minutes: 0, end_minutes: 0, on_kshaya: start_day, on_vriddhi: first}
  amavasya:
    label: Amavasya
    verified: true
    source: {text: "Dharmasindhu, English summary (Kamakoti); Tulu Panchanga app docs/VERIFY.md", locus: "ch. 3 Tithi Nirnaya"}
    rules:
      all: {tithis: [30], anchor: sunrise, start_minutes: 0, end_minutes: 0, on_kshaya: start_day, on_vriddhi: first}
  sankashti:
    label: Sankashti Chaturthi
    # Read 2026-11-22. Rule: Krishna Chaturthi (tithi 19) present at local moonrise, the Tulu Panchanga app's documented
    # rule ("Chaturthi at moonrise, every paksha/month"), and the day the family's printed calendar marks (Friday 27 Nov 2026,
    # Mangaluru; moonrise 20:59, Chaturthi from 09:49). No vedha and no kshaya/vriddhi tie-break are sourced, so the defaults
    # apply. NO primary text has been read for this rule yet; the day is a calendar convention, and no claim is made about
    # what the day signifies.
    verified: true
    source: {text: "Tulu Panchanga app festival rule; family printed calendar 2026 (27 Nov)", locus: "app festivals_mangaluru_2026.csv; family calendar, Nov 2026"}
    rules:
      all: {tithis: [19], anchor: moonrise, start_minutes: 0, end_minutes: 0, on_kshaya: start_day, on_vriddhi: first}

# Traditional care: days traditionally not chosen for starting auspicious things (weddings, housewarming, new
# ventures). Owner decision 2026-11-22: show these as widely known muhurta tradition, NOT as a family custom. The
# only sources found are modern muhurta guides that paraphrase Muhurta Chintamani; no primary text or verse-level
# translation has been read, so `checked: false` and the bot shows them on a separate line saying so. They are not
# entries (that machinery means checked against a translation). Sources:
#   https://atmanandanatha.in/marriage-muhurtas/
#   https://dekhopanchang.com/en/learn/vivah-muhurta
#   https://www.roopalia.com/en/vrat/what-not-to-do-on-amavasya-new-moon-day.html (also cites Manusmriti 3.122-127
#   for ancestor rites on Amavasya; secondary)
# applies_to is {tithi: 30} (sunrise tithi, 30 = Amavasya) or {nakshatra: <name>} (Moon's nakshatra at sunrise,
# any case).
traditional_care:
  - id: amavasya
    applies_to: {tithi: 30}
    text: "Amavasya (new moon day) is traditionally not chosen for starting auspicious things such as a wedding, a housewarming or a new venture."
    basis: "Modern muhurta guides paraphrasing Muhurta Chintamani; original text not read by us"
    checked: false
  - id: bharani
    applies_to: {nakshatra: bharani}
    text: "Days when the Moon is in Bharani are traditionally not chosen for starting auspicious things such as a wedding, a housewarming or a new venture."
    basis: "Modern muhurta guides paraphrasing Muhurta Chintamani; original text not read by us"
    checked: false
  - id: krittika
    applies_to: {nakshatra: krittika}
    text: "Days when the Moon is in Krittika are traditionally not chosen for starting auspicious things such as a wedding, a housewarming or a new venture."
    basis: "Modern muhurta guides paraphrasing Muhurta Chintamani; original text not read by us"
    checked: false
  # Rohini (owner, 2026-11-25): the family calendar marks 25 Nov and 23 Dec 2026 as auspicious; the Moon is in Rohini at
  # sunrise on exactly those two days in Nov-Dec (the engine checks this in tests/test_family_calendar.py). Located text: Brihat
  # Samhita ch. 98 ("On the Functions and Properties of the Asterisms", Sastri translation, read as OCR text, sloka number
  # not confirmed against the page image) calls Rohini and the three Uttaras "Dhruva" (fixed) and says they suit coronations,
  # expiatory rites, planting trees, laying the foundations of towns and starting meritorious acts. Shown as labelled
  # tradition like the notes above, not as a checked entry. The Uttaras are NOT added: the family has not marked them.
  - id: rohini
    applies_to: {nakshatra: rohini}
    text: "Days when the Moon is in Rohini are traditionally considered favourable for starting lasting things, such as laying a foundation, planting trees or beginning a meritorious undertaking."
    basis: "Family calendar marks these days; Brihat Samhita ch. 98 (Sastri translation) lists Rohini among the fixed (dhruva) nakshatras suited to such beginnings; sloka number not confirmed against the page image"
    checked: false
