# Phaladeepika chapter 2: what each planet signifies (verses 1-7) and its build and temperament (verses 8-14). PARAPHRASED from Kapoor's translation (in copyright), pp. 17-21.
# Added 2026-11-13. UNCHECKED: not shown until a person compares each entry with the pages and sets level: translation-checked. See research/notes/reading-status.md.

- id: ph-2-1-sun-signifies
  topic: planet:sun
  system: any
  english: >-
    In Mantreswara's Phaladeepika the Sun signifies: father, patience, valour, victory in battle, the soul, auspiciousness, happiness, power and light; copper and gold; work for Lord Shiva, journeys in forests and mountains, sacrifices, a liking for work, temples, acuteness and enthusiasm.
  citation: {text: Phaladeepika, chapter: 2, verse: "1", edition: "tr. Dr G. S. Kapoor (panchanga.lv PDF), pp. 17-18"}
  verification: {level: unchecked}

- id: ph-2-8-sun-nature
  topic: planet:sun
  system: any
  english: >-
    Phaladeepika describes the Sun as bilious in temperament, with strong bones and scanty hair; a dark red form, reddish-brown eyes and red clothes; a square build, brave, with massive arms.
  citation: {text: Phaladeepika, chapter: 2, verse: "8", edition: "tr. Dr G. S. Kapoor (panchanga.lv PDF), pp. 20"}
  verification: {level: unchecked}

- id: ph-2-2-moon-signifies
  topic: planet:moon
  system: any
  english: >-
    In Mantreswara's Phaladeepika the Moon signifies: the welfare of the mother, peace of mind, bathing in the sea, a white chamara, an umbrella, a fan, fruits, flowers, tender things, farm grain, fame, pearls, silver, bell metal and beauty.
  citation: {text: Phaladeepika, chapter: 2, verse: "2", edition: "tr. Dr G. S. Kapoor (panchanga.lv PDF), p. 18"}
  verification: {level: unchecked}

- id: ph-2-9-moon-nature
  topic: planet:moon
  system: any
  english: >-
    Phaladeepika describes the Moon as a huge body, both young and old, lean and white; attractive eyes and thin black hair; rules the blood; soft-spoken, in white clothes with a fair complexion, mild, with wind and phlegm in her make-up.
  citation: {text: Phaladeepika, chapter: 2, verse: "9", edition: "tr. Dr G. S. Kapoor (panchanga.lv PDF), pp. 20-21"}
  verification: {level: unchecked}

- id: ph-2-3-mars-signifies
  topic: planet:mars
  system: any
  english: >-
    In Mantreswara's Phaladeepika the Mars signifies: physical and mental strength, things produced from the earth, brothers and sisters, cruelty, battle, courage, antagonism, the kitchen fire, gold, kinsmen, weapons, thieves, enemies, enthusiasm, relations with another man's wife, falsehood, prowess, high thinking, sin, wounds, and becoming a commander-in-chief.
  citation: {text: Phaladeepika, chapter: 2, verse: "3", edition: "tr. Dr G. S. Kapoor (panchanga.lv PDF), pp. 18-19"}
  verification: {level: unchecked}

- id: ph-2-10-mars-nature
  topic: planet:mars
  system: any
  english: >-
    Phaladeepika describes the Mars as a lean waist and bright curly hair; a fierce look and a cruel, bilious nature; red clothes and a red hue; wrathful yet very generous; youthful in looks and rules the marrow.
  citation: {text: Phaladeepika, chapter: 2, verse: "10", edition: "tr. Dr G. S. Kapoor (panchanga.lv PDF), pp. 21"}
  verification: {level: unchecked}

- id: ph-2-4-mercury-signifies
  topic: planet:mercury
  system: any
  english: >-
    In Mantreswara's Phaladeepika the Mercury signifies: learning, eloquence, skill in the arts, praise from the learned, the maternal uncle, dexterity in speech, aptness for knowledge, ways of worship, intelligence, religious acts for Lord Shiva, truthfulness, places of recreation, skill in mechanical arts, kinsmen, the heir apparent, friends, and sisters' children.
  citation: {text: Phaladeepika, chapter: 2, verse: "4", edition: "tr. Dr G. S. Kapoor (panchanga.lv PDF), p. 19"}
  verification: {level: unchecked}

- id: ph-2-11-mercury-nature
  topic: planet:mercury
  system: any
  english: >-
    Phaladeepika describes the Mercury as green like durva grass; a mix of wind, bile and phlegm; a body full of veins; soft-spoken, evenly built and fond of fun; governs the skin.
  citation: {text: Phaladeepika, chapter: 2, verse: "11", edition: "tr. Dr G. S. Kapoor (panchanga.lv PDF), pp. 21"}
  verification: {level: unchecked}

- id: ph-2-5-jupiter-signifies
  topic: planet:jupiter
  system: any
  english: >-
    In Mantreswara's Phaladeepika the Jupiter signifies: knowledge, noble qualities, children, a minister, good behaviour, teaching, magnanimity, knowledge of the scriptures, progress in every direction, devotion to gods and Brahmins, sacrifice, penance, faith, the treasury, mastery of the senses, honour, kindness, and the husband's happiness; the book adds that in a woman's chart Jupiter signifies the husband, and in a man's chart, children.
  citation: {text: Phaladeepika, chapter: 2, verse: "5", edition: "tr. Dr G. S. Kapoor (panchanga.lv PDF), p. 19"}
  verification: {level: unchecked}

- id: ph-2-12-jupiter-nature
  topic: planet:jupiter
  system: any
  english: >-
    Phaladeepika describes the Jupiter as a yellowish body with brown eyes and hair; a firm, high chest and a huge frame; phlegm predominates; very intelligent, with a voice like a lion or a conch, always after wealth.
  citation: {text: Phaladeepika, chapter: 2, verse: "12", edition: "tr. Dr G. S. Kapoor (panchanga.lv PDF), pp. 21"}
  verification: {level: unchecked}

- id: ph-2-6-venus-signifies
  topic: planet:venus
  system: any
  english: >-
    In Mantreswara's Phaladeepika the Venus signifies: wealth, vehicles, clothes, ornaments, treasures, song, dance and music, scents, flowers, married life, the bed, the house, richness, a fondness for poetry, comforts and luxuries, ministership, soft speech, marriage and other holy deeds and celebrations; the book adds that in a man's chart Venus signifies the wife and marital happiness.
  citation: {text: Phaladeepika, chapter: 2, verse: "6", edition: "tr. Dr G. S. Kapoor (panchanga.lv PDF), pp. 19-20"}
  verification: {level: unchecked}

- id: ph-2-13-venus-nature
  topic: planet:venus
  system: any
  english: >-
    Phaladeepika describes the Venus as clothes of many colours and curly hair; a huge, well-proportioned body, phlegm and wind predominate; the colour of durva sprouts, very beautiful, broad-eyed, with well-kept virility; governs semen.
  citation: {text: Phaladeepika, chapter: 2, verse: "13", edition: "tr. Dr G. S. Kapoor (panchanga.lv PDF), pp. 21"}
  verification: {level: unchecked}

- id: ph-2-7-saturn-signifies
  topic: planet:saturn
  system: any
  english: >-
    In Mantreswara's Phaladeepika the Saturn signifies: long life, death, fear, downfall, disgrace, sickness, unhappiness, poverty, humiliation, sins, labour, filth, censure, misfortune, impurity of mind, rites after a death in the family, stability, taking shelter with menials, buffaloes, drowsiness, debts, iron, service, slavery, confinement, arrest and farm tools.
  citation: {text: Phaladeepika, chapter: 2, verse: "7", edition: "tr. Dr G. S. Kapoor (panchanga.lv PDF), p. 20"}
  verification: {level: unchecked}

- id: ph-2-14-saturn-nature
  topic: planet:saturn
  system: any
  english: >-
    Phaladeepika describes the Saturn as lame, with deep-set eyes and a large lean body full of veins; lazy, black-skinned, with wind predominant; hard-hearted and a backbiter, dull-headed, large teeth and nails, stiff hair and limbs; impure, fierce-looking and ill-tempered, in black clothes and looking old.
  citation: {text: Phaladeepika, chapter: 2, verse: "14", edition: "tr. Dr G. S. Kapoor (panchanga.lv PDF), pp. 21"}
  verification: {level: unchecked}
