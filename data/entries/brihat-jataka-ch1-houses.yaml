# Brihat Jataka I.15-16: what each house stands for. Written from N. Chidambaram Iyer's English
# translation (Madras 1885, public domain; archive.org b2488442x, pp. 11-12). Paraphrased; UNCHECKED.
# The 'translator's note' entries come from Iyer's notes to stanza 15, not from Varahamihira, and say so.

- id: bj-1-15-house-1
  topic: house:1
  system: any
  english: >-
    Varahamihira says the 1st house from the rising sign (the lagna, or rising sign, itself) signifies the body, and gives it the
    technical name Kalpa (power).
  citation: {text: Brihat Jataka, chapter: 1, verse: "15-16", edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-1-15-note-house-1
  topic: house:1
  system: any
  english: >-
    The translator, N. Chidambaram Iyer, adds in his notes that the 1st house covers body, fame and limbs.
  citation: {text: Brihat Jataka, chapter: 1, verse: "15, translator's note", edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

