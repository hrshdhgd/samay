# Brihat Jataka of Varahamihira, chapter II, stanza 1: what each planet stands for.
# Written from N. Chidambaram Iyer's English translation (Madras: Foster Press, 1885), which is in
# the public domain (Public Domain Mark on the Wellcome copy, archive.org item b2488442x, p. 14).
# Paraphrased in our own words. Checked by h2 on 2026-11-09 against stanza 1 of that translation.
# Stanza 1 names seven planets only; it says nothing about Rahu or Ketu.

- id: bj-2-1-sun
  topic: planet:sun
  system: any
  english: >-
    Varahamihira describes the Sun as the soul of the cosmic person (Kalapurusha). Among the planets he counts it
    as a king, together with the Moon.
  citation: {text: Brihat Jataka, chapter: 2, verse: 1, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: translation-checked, checked_by: h2, checked_on: 2026-11-09,
                 against: "tr. N. Chidambaram Iyer, Madras 1885 (public domain), ch. II st. 1, p. 14"}

- id: bj-2-1-moon
  topic: planet:moon
  system: any
  english: >-
    Varahamihira describes the Moon as the mind of the cosmic person (Kalapurusha). Among the planets he counts it
    as a king, together with the Sun.
  citation: {text: Brihat Jataka, chapter: 2, verse: 1, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: translation-checked, checked_by: h2, checked_on: 2026-11-09,
                 against: "tr. N. Chidambaram Iyer, Madras 1885 (public domain), ch. II st. 1, p. 14"}

- id: bj-2-1-mars
  topic: planet:mars
  system: any
  english: >-
    Varahamihira describes Mars as the strength of the cosmic person (Kalapurusha). Among the planets he calls it
    the general (commander of the army).
  citation: {text: Brihat Jataka, chapter: 2, verse: 1, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: translation-checked, checked_by: h2, checked_on: 2026-11-09,
                 against: "tr. N. Chidambaram Iyer, Madras 1885 (public domain), ch. II st. 1, p. 14"}

- id: bj-2-1-mercury
  topic: planet:mercury
  system: any
  english: >-
    Varahamihira describes Mercury as the speech of the cosmic person (Kalapurusha). Among the planets he calls it
    the prince (heir to the throne).
  citation: {text: Brihat Jataka, chapter: 2, verse: 1, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: translation-checked, checked_by: h2, checked_on: 2026-11-09,
                 against: "tr. N. Chidambaram Iyer, Madras 1885 (public domain), ch. II st. 1, p. 14"}

- id: bj-2-1-jupiter
  topic: planet:jupiter
  system: any
  english: >-
    Varahamihira describes Jupiter as the knowledge and health of the cosmic person (Kalapurusha). Among the
    planets he counts it as a counsellor (minister), together with Venus.
  citation: {text: Brihat Jataka, chapter: 2, verse: 1, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: translation-checked, checked_by: h2, checked_on: 2026-11-09,
                 against: "tr. N. Chidambaram Iyer, Madras 1885 (public domain), ch. II st. 1, p. 14"}

- id: bj-2-1-venus
  topic: planet:venus
  system: any
  english: >-
    Varahamihira describes Venus as the desire of the cosmic person (Kalapurusha). Among the planets he counts it
    as a counsellor (minister), together with Jupiter.
  citation: {text: Brihat Jataka, chapter: 2, verse: 1, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: translation-checked, checked_by: h2, checked_on: 2026-11-09,
                 against: "tr. N. Chidambaram Iyer, Madras 1885 (public domain), ch. II st. 1, p. 14"}

- id: bj-2-1-saturn
  topic: planet:saturn
  system: any
  english: >-
    Varahamihira describes Saturn as the sorrow of the cosmic person (Kalapurusha). Among the planets he calls it
    the servant.
  citation: {text: Brihat Jataka, chapter: 2, verse: 1, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: translation-checked, checked_by: h2, checked_on: 2026-11-09,
                 against: "tr. N. Chidambaram Iyer, Madras 1885 (public domain), ch. II st. 1, p. 14"}

# ---- Brihat Jataka I.4: what "the cosmic person (Kalapurusha)" means. UNCHECKED. ----------------
- id: bj-1-4-kalapurusha
  topic: concept:kalapurusha
  system: any
  english: >-
    Varahamihira pictures the twelve signs of the zodiac as the body of one cosmic person
    (Kalapurusha): from Aries as the head, through the face, chest, heart, belly, navel, lower
    abdomen, genitals, thighs, knees and ankles, down to Pisces as the feet.
  citation: {text: Brihat Jataka, chapter: 1, verse: 4, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

# ---- Brihat Jataka II.2-3: other classical names of the planets. UNCHECKED. ---------------------
- id: bj-2-2-names-sun
  topic: planet:sun
  system: any
  english: >-
    Varahamihira gives Heli as another classical name for the Sun.
  citation: {text: Brihat Jataka, chapter: 2, verse: 2, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-2-names-moon
  topic: planet:moon
  system: any
  english: >-
    Varahamihira gives Sitarashmi ("the cool-rayed one") as another classical name for the Moon.
  citation: {text: Brihat Jataka, chapter: 2, verse: 2, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-2-names-mercury
  topic: planet:mercury
  system: any
  english: >-
    Varahamihira gives Hemna, Vit, Jna, Bodhana and Induputra ("son of the Moon") as other classical
    names for Mercury.
  citation: {text: Brihat Jataka, chapter: 2, verse: 2, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-2-names-mars
  topic: planet:mars
  system: any
  english: >-
    Varahamihira gives Ara, Vakra, Kruradrik and Avaneya ("son of the Earth") as other classical names
    for Mars.
  citation: {text: Brihat Jataka, chapter: 2, verse: 2, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-2-names-saturn
  topic: planet:saturn
  system: any
  english: >-
    Varahamihira gives Kona, Manda, Suryaputra ("son of the Sun") and Asita ("the black planet") as
    other classical names for Saturn.
  citation: {text: Brihat Jataka, chapter: 2, verse: 2, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-3-names-jupiter
  topic: planet:jupiter
  system: any
  english: >-
    Varahamihira gives Jeeva, Angirasa, Suraguru ("teacher of the gods"), Vachaspati and Ijya as other
    classical names for Jupiter.
  citation: {text: Brihat Jataka, chapter: 2, verse: 3, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-3-names-venus
  topic: planet:venus
  system: any
  english: >-
    Varahamihira gives Sukra, Bhrigu, Bhrigusuta, Sita ("the white planet") and Asphujit as other
    classical names for Venus.
  citation: {text: Brihat Jataka, chapter: 2, verse: 3, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-3-names-rahu
  topic: planet:rahu
  system: any
  english: >-
    Varahamihira gives Tama ("darkness"), Agu and Asura as other names for Rahu, which he identifies
    as the Moon's ascending node.
  citation: {text: Brihat Jataka, chapter: 2, verse: 3, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-3-names-ketu
  topic: planet:ketu
  system: any
  english: >-
    Varahamihira gives Sikhi as another name for Ketu, which he identifies as the Moon's descending
    node.
  citation: {text: Brihat Jataka, chapter: 2, verse: 3, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

# ---- Brihat Jataka II.4-11: colour, gender, element, temperament, appearance. UNCHECKED. --------
# Stanza 7's first half (caste) is deliberately not used. Stanzas 4-6 and 8-11 do not cover Rahu and Ketu.
- id: bj-2-4-colour-sun
  topic: planet:sun
  system: any
  english: >-
    Varahamihira says Sun is red and dark brown, and presides over copper colour.
  citation: {text: Brihat Jataka, chapter: 2, verse: "4-5", edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-6-nature-sun
  topic: planet:sun
  system: any
  english: >-
    Varahamihira counts Sun as male, gives it the element fire (from the translator's note), and its temperament as good (sattva).
  citation: {text: Brihat Jataka, chapter: 2, verse: "6-7", edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-8-appearance-sun
  topic: planet:sun
  system: any
  english: >-
    Varahamihira pictures Sun with somewhat yellow eyes, the height of a man's outstretched arms, a bilious nature and very little hair on the head.
  citation: {text: Brihat Jataka, chapter: 2, verse: 8, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-4-colour-moon
  topic: planet:moon
  system: any
  english: >-
    Varahamihira says Moon is white, and presides over white.
  citation: {text: Brihat Jataka, chapter: 2, verse: "4-5", edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-6-nature-moon
  topic: planet:moon
  system: any
  english: >-
    Varahamihira counts Moon as female, gives it the element water (from the translator's note), and its temperament as good (sattva).
  citation: {text: Brihat Jataka, chapter: 2, verse: "6-7", edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-8-appearance-moon
  topic: planet:moon
  system: any
  english: >-
    Varahamihira pictures Moon with a thin, round body, a very windy and phlegmatic nature, learning, a soft voice and beautiful eyes.
  citation: {text: Brihat Jataka, chapter: 2, verse: 8, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-4-colour-mars
  topic: planet:mars
  system: any
  english: >-
    Varahamihira says Mars is both red and white, and presides over red; it is not tall.
  citation: {text: Brihat Jataka, chapter: 2, verse: "4-5", edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-6-nature-mars
  topic: planet:mars
  system: any
  english: >-
    Varahamihira counts Mars as male, gives it the element fire, and its temperament as dark (tamas).
  citation: {text: Brihat Jataka, chapter: 2, verse: "6-7", edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-9-appearance-mars
  topic: planet:mars
  system: any
  english: >-
    Varahamihira pictures Mars with sharp, cruel eyes, a young body, a generous but unsteady mind, a bilious nature and a narrow waist.
  citation: {text: Brihat Jataka, chapter: 2, verse: 9, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-4-colour-mercury
  topic: planet:mercury
  system: any
  english: >-
    Varahamihira says Mercury is green like durva grass, and presides over green.
  citation: {text: Brihat Jataka, chapter: 2, verse: "4-5", edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-6-nature-mercury
  topic: planet:mercury
  system: any
  english: >-
    Varahamihira counts Mercury as neither male nor female (the translator's note says 'female'), gives it the element earth, and its temperament as passionate (rajas).
  citation: {text: Brihat Jataka, chapter: 2, verse: "6-7", edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-9-appearance-mercury
  topic: planet:mercury
  system: any
  english: >-
    Varahamihira pictures Mercury with a halting speech, a fondness for jokes, and a bilious, windy and phlegmatic nature.
  citation: {text: Brihat Jataka, chapter: 2, verse: 9, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-4-colour-jupiter
  topic: planet:jupiter
  system: any
  english: >-
    Varahamihira says Jupiter is yellow like molten gold, and presides over yellow.
  citation: {text: Brihat Jataka, chapter: 2, verse: "4-5", edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-6-nature-jupiter
  topic: planet:jupiter
  system: any
  english: >-
    Varahamihira counts Jupiter as male, gives it the element ether (akasha), and its temperament as good (sattva).
  citation: {text: Brihat Jataka, chapter: 2, verse: "6-7", edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-10-appearance-jupiter
  topic: planet:jupiter
  system: any
  english: >-
    Varahamihira pictures Jupiter with a large body, yellow hair and eyes, high intellect and a phlegmatic nature.
  citation: {text: Brihat Jataka, chapter: 2, verse: 10, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-4-colour-venus
  topic: planet:venus
  system: any
  english: >-
    Varahamihira says Venus is neither very white nor very dark, and presides over a mix of colours.
  citation: {text: Brihat Jataka, chapter: 2, verse: "4-5", edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-6-nature-venus
  topic: planet:venus
  system: any
  english: >-
    Varahamihira counts Venus as female, gives it the element water, and its temperament as passionate (rajas).
  citation: {text: Brihat Jataka, chapter: 2, verse: "6-7", edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-10-appearance-venus
  topic: planet:venus
  system: any
  english: >-
    Varahamihira pictures Venus with a comfortable life, a beautiful body, fair eyes, black curly hair, and a windy and phlegmatic nature.
  citation: {text: Brihat Jataka, chapter: 2, verse: 10, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-4-colour-saturn
  topic: planet:saturn
  system: any
  english: >-
    Varahamihira says Saturn is black, and presides over black.
  citation: {text: Brihat Jataka, chapter: 2, verse: "4-5", edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-6-nature-saturn
  topic: planet:saturn
  system: any
  english: >-
    Varahamihira counts Saturn as neither male nor female (the translator's note says 'male'), gives it the element air, and its temperament as dark (tamas).
  citation: {text: Brihat Jataka, chapter: 2, verse: "6-7", edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-11-appearance-saturn
  topic: planet:saturn
  system: any
  english: >-
    Varahamihira pictures Saturn with laziness, golden-coloured eyes, a thin and tall body, large teeth, stiff hair and a windy nature.
  citation: {text: Brihat Jataka, chapter: 2, verse: 11, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}
