  citation: {text: Brihat Jataka, chapter: 2, verse: 1, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-1-saturn
  topic: planet:saturn
  system: any
  english: >-
    Varahamihira describes Saturn as the sorrow of the cosmic person. Among the planets he calls it
