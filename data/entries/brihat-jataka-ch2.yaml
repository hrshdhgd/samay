  citation: {text: Brihat Jataka, chapter: 2, verse: 1, edition: "tr. N. Chidambaram Iyer, Madras 1885"}
  verification: {level: unchecked}

- id: bj-2-1-venus
  topic: planet:venus
  system: any
  english: >-
    Varahamihira describes Venus as the desire of the cosmic person. Among the planets he counts it
