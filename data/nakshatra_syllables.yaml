# Birth-star naming syllables (the Avakahada chakra): the first sound of a name for the pada the Moon was in at birth.
# 27 nakshatras x 4 padas = 108. Compared pada by pada between two independent sites on 2026-11-10 (they agree on
# all 108): desiutils.in/astrology/birth-star-calculator (Roman and Devanagari) and hindumirror.com/
# nakshatra-starting-letters-for-baby-names/. Both are modern pages that cite the panchanga tradition (Swar Siddhanta
# tables), not a classical verse. `also` lists readings the second site says are in current use alongside the first
# (Shravana is the clearest case: Khi Khu Khe Kho in one panchanga tradition, Ju Je Jo Gha in another).
# Every syllable is quoted: bare No, Yes, On and Off would be read by YAML as true or false.
# See research/notes/gaps-research.md.

