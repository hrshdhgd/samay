services:
  samay:
    build:
      context: .
      target: runtime
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: samay:latest
    restart: unless-stopped
    env_file: .env
    # Shares a 4-core box with other projects; the bot idles at ~100 MB.
    mem_limit: 512m
    cpus: 1.0
    volumes:
      - samay-data:/var/lib/samay
    # Narration is off unless OLLAMA_URL is set in .env. On the Oracle server the host Ollama is
    # reached at the docker0 gateway (http://172.17.0.1:11434); there is no Ollama sidecar.

volumes:
  samay-data:
